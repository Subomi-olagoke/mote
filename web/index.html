<!doctype html>
<!-- web/index.html — mote in a browser tab.

     The same engine, compiled to WebAssembly (see build.sh), running in a
     worker. The page fetches nothing itself; it boots the worker, shows model
     download progress, then streams chat turns. Append ?auto to the URL to
     run a fixed prompt on load (hands-free benchmarking).

     Which model? ?model=<name> picks any .mq in models/ explicitly; otherwise
     models/default.mq (a symlink or copy the deployment provides) wins, and
     qwen05b_q4 is the fallback.

     Serve from the repo root so ../models/ resolves:
       python3 -m http.server 8000       then open  /web/                  -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mote</title>
<style>
  :root {
    --bg: #fcfcfc; --fg: #1a1a1a; --dim: #8a8a8a; --faint: #b5b5b5;
    --line: #ebebeb; --bubble: #f0f0f0; --accent: #0a84ff; --accent-fg: #fff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #ececec; --dim: #8b8b8b; --faint: #555;
            --line: #242424; --bubble: #1f1f1f; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.65 var(--mono);
    display: flex; flex-direction: column;
  }

  /* ---- header: pinned to the left edge of the site ---- */
  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .head-inner {
    padding: 14px 20px 12px;
    display: flex; align-items: baseline; gap: 14px;
  }
  .wordmark { font: 600 17px var(--mono); letter-spacing: -0.02em; }
  #stats { font: 12px var(--mono); color: var(--dim); flex: 1; min-height: 18px; }
  #progress { height: 2px; background: none; }
  #progress > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }

  /* ---- conversation ---- */
  main { flex: 1; width: 100%; }
  #chat {
    max-width: 680px; margin: 0 auto; padding: 24px 20px 120px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .msg { white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user {
    align-self: flex-end; max-width: 85%;
    background: var(--bubble); border-radius: 16px 16px 4px 16px;
    padding: 8px 14px;
  }
  .msg.assistant { align-self: stretch; padding: 0 2px; }
  .msg.assistant.streaming::after {
    content: "▍"; color: var(--accent);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  .meta {
    align-self: stretch; margin-top: -12px; padding: 0 2px;
    font: 11px var(--mono); color: var(--faint);
  }
  #empty {
    max-width: 680px; margin: 18vh auto 0; padding: 0 20px;
    text-align: center; color: var(--dim);
  }
  #empty .big { font: 600 15px var(--mono); margin-bottom: 6px; }
  #perf { display: none; }   /* kept for harnesses; per-reply meta shows it now */

  /* ---- input ---- */
  form {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 18px 20px 22px;
  }
  .form-inner {
    max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: center;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 6px 6px 14px; box-shadow: 0 4px 20px rgba(0,0,0,.06);
  }
  .form-inner:focus-within { border-color: var(--dim); }
  input {
    flex: 1; font: 14px var(--mono); color: inherit;
    background: none; border: 0; outline: none; min-width: 0;
  }
  input::placeholder { color: var(--faint); }
  button {
    width: 32px; height: 32px; flex: none; border: 0; border-radius: 7px;
    background: var(--accent); color: var(--accent-fg);
    font-size: 15px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  button:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <span class="wordmark">mote</span>
    <span id="stats">starting…</span>
  </div>
  <div id="progress"><div></div></div>
</header>

<main>
  <div id="empty">
    <div class="big">a tiny language model, run from scratch in C</div>
    <div>Everything happens on this device. Type a prompt to start.</div>
  </div>
  <div id="chat"></div>
  <div id="perf"></div>
</main>

<form id="form">
  <div class="form-inner">
    <input id="input" placeholder="loading model…" autocomplete="off" disabled>
    <button id="send" type="submit" disabled aria-label="send">↑</button>
  </div>
</form>

<script>
const $ = id => document.getElementById(id);
const worker = new Worker('worker.js');
let current = null;      // the streaming assistant element
let history = [];        // finished turns, replayed for multi-turn context
let pendingUser = null;  // the user text of the in-flight turn

/* The system prompt is deliberately generic: identity belongs in the weights,
 * not the page. Power users can still override it for this browser with
 * localStorage.setItem('mote-system', '...') in the console. */
const DEFAULT_SYSTEM = 'You are a helpful assistant.';
const systemPrompt = () => localStorage.getItem('mote-system') || DEFAULT_SYSTEM;

function bubble(cls, text) {
  $('empty').style.display = 'none';
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  $('chat').appendChild(d);
  return d;
}

/* follow the stream only while the reader is already at the bottom */
function pinned() {
  return innerHeight + scrollY >= document.body.scrollHeight - 160;
}

worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === 'progress') {
    $('stats').textContent =
      `downloading ${m.label} · ${(m.loaded / 1e6).toFixed(0)} / ${(m.total / 1e6).toFixed(0)} MB`;
    $('progress').firstElementChild.style.width = (100 * m.loaded / m.total) + '%';
  } else if (m.type === 'ready') {
    const i = m.info;
    const params = i.vocab * i.dim + i.layers * (2 * i.dim * i.dim
                 + 2 * i.dim * (i.kvHeads * (i.dim / i.heads)) + 3 * i.dim * i.hidden);
    $('stats').textContent =
      `${i.quantized ? 'int' + i.qbits : 'fp32'} · ~${(params / 1e6).toFixed(0)}M params · ${i.layers} layers · ctx ${i.ctx} · wasm`;
    $('progress').remove();
    $('input').disabled = $('send').disabled = false;
    $('input').placeholder = 'Message…';
    $('input').focus();
    if (new URLSearchParams(location.search).has('auto'))
      ask('What is the capital of Japan?');
  } else if (m.type === 'token') {
    if (current) {
      const follow = pinned();
      current.textContent += m.text;
      if (follow) scrollTo(0, document.body.scrollHeight);
    }
  } else if (m.type === 'done') {
    if (current) {
      current.classList.remove('streaming');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent =
        `${m.tokensPerSecond.toFixed(1)} tok/s · ${m.tokens} tokens · ${m.seconds.toFixed(1)}s`;
      $('chat').appendChild(meta);
      $('perf').textContent = meta.textContent + ` · ${m.msToFirst.toFixed(0)} ms to first`;
      if (pendingUser !== null && current.textContent.trim()) {
        // an empty exchange is never worth replaying: a template where the
        // assistant answers nothing teaches the model to answer nothing
        history.push({ user: pendingUser, assistant: current.textContent });
        if (history.length > 4) history.shift();   // bound the replayed context
      }
    }
    pendingUser = null;
    current = null;
    $('input').disabled = $('send').disabled = false;
    $('input').focus();
  } else if (m.type === 'error') {
    $('stats').textContent = 'error: ' + m.message;
    if (current) current.classList.remove('streaming');
  }
};

function ask(text) {
  bubble('user', text);
  current = bubble('assistant', '');
  current.classList.add('streaming');
  pendingUser = text;
  $('input').value = '';
  $('input').disabled = $('send').disabled = true;
  scrollTo(0, document.body.scrollHeight);
  worker.postMessage({ type: 'generate', text, maxNew: 200,
                       system: systemPrompt(), history });
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (text && !$('send').disabled) ask(text);
});

const q = new URLSearchParams(location.search);
(async () => {
  let model = q.get('model');
  if (!model) {
    const probe = await fetch('../models/default.mq', { method: 'HEAD' }).catch(() => null);
    model = probe && probe.ok ? 'default' : 'qwen05b_q4';
  }
  worker.postMessage({ type: 'boot',
                       model: `../models/${model}.mq`,
                       tokenizer: `../models/${q.get('tok') || 'qwen'}.mtok` });
})();
</script>
</body>
</html>
